<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b111b" />
    <title>MTSFX Strategy Indicator</title>
    <style>
        :root {
            --bg: #0b111b;
            --panel: rgba(15, 23, 42, 0.96);
            --panel-2: rgba(11, 18, 32, 0.96);
            --border: rgba(148, 163, 184, 0.16);
            --text: #e2e8f0;
            --muted: #8ea0bb;
            --blue: #60a5fa;
            --green: #21c87a;
            --red: #f87171;
            --amber: #fbbf24;
            --purple: #a78bfa;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: min(100%, 1100px);
            min-height: 720px;
            background: linear-gradient(180deg, rgba(15,23,42,0.95), rgba(11,17,27,0.98));
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            overflow: hidden;
        }

        .header {
            padding: 20px 22px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            margin: 0;
            font-size: clamp(1.4rem, 2vw, 2rem);
            color: var(--blue);
        }

        .header p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 0.78rem;
        }

        .hidden {
            display: none !important;
        }

        .auth-box,
        .license-box,
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
        }

        .auth-box {
            width: min(100%, 500px);
            margin: 60px auto 0;
        }

        .auth-box h2,
        .license-box h2 {
            margin: 0 0 16px;
            color: var(--blue);
        }

        .form-grid {
            display: grid;
            gap: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid rgba(96, 165, 250, 0.4);
            background: rgba(15, 23, 42, 0.72);
            color: var(--text);
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 2px rgba(96,165,250,0.16);
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .primary-btn {
            background: linear-gradient(180deg, #4f8cff, #2d68ff);
            color: white;
        }

        .primary-btn:hover {
            background: linear-gradient(180deg, #5d98ff, #2d6df8);
            transform: translateY(-1px);
        }

        .secondary-btn {
            background: rgba(96, 165, 250, 0.12);
            border: 1px solid rgba(96, 165, 250, 0.35);
            color: var(--blue);
        }

        .license-status {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
        }

        .license-status.active {
            background: rgba(34, 197, 94, 0.08);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.35);
        }

        .license-status.inactive {
            background: rgba(239, 68, 68, 0.08);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.35);
        }

        .content {
            display: none;
            padding: 18px;
            gap: 18px;
            flex-direction: column;
        }

        .content.active {
            display: flex;
        }

        .api-key-info {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(96, 165, 250, 0.2);
            border-radius: 10px;
            padding: 12px 14px;
            color: #bfdbfe;
            font-size: 0.82rem;
        }

        .api-key-info a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 700;
        }

        .api-key-section {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .api-key-section input {
            flex: 1;
        }

        .pair-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pair-btn {
            flex: 1 1 140px;
            min-width: 120px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.24);
            color: #dbe4f0;
            border-radius: 8px;
            padding: 10px 12px;
            font-weight: 700;
        }

        .pair-btn.active {
            background: linear-gradient(180deg, #4f8cff, #2d68ff);
            color: #fff;
            border-color: rgba(96, 165, 250, 0.9);
        }

        .chart-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }

        .chart-panel {
            background: #0b1220;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .chart-title {
            background: rgba(15, 23, 42, 0.96);
            padding: 10px 12px;
            border-bottom: 1px solid rgba(148,163,184,0.12);
            color: var(--muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        canvas {
            display: block;
            width: 100%;
            height: 260px;
            background: #0b1220;
        }

        .signal-box {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .signal {
            border-radius: 10px;
            padding: 16px 12px;
            text-align: center;
            font-weight: 800;
            border: 1px solid transparent;
        }

        .signal.buy {
            background: rgba(34, 197, 94, 0.08);
            color: #4ade80;
            border-color: rgba(74, 222, 128, 0.45);
        }

        .signal.sell {
            background: rgba(239, 68, 68, 0.08);
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.45);
        }

        .signal.neutral {
            background: rgba(96, 165, 250, 0.08);
            color: #bfdbfe;
            border-color: rgba(96, 165, 250, 0.25);
        }

        .signal small {
            display: block;
            margin-top: 6px;
            opacity: 0.9;
            font-size: 0.72rem;
        }

        .error-message {
            display: none;
            background: rgba(239, 68, 68, 0.08);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.35);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.8rem;
            margin-top: 12px;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 700px) {
            body {
                padding: 12px;
            }

            .container {
                min-height: auto;
            }

            .signal-box {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 MT4 / MT5 Forex Indicator</h1>
            <p>Login first, activate your license, then access the dashboard.</p>
        </div>

        <div id="loginSection" class="auth-box">
            <h2>🔐 Login</h2>
            <div class="form-grid">
                <input id="usernameInput" type="text" placeholder="Username" />
                <input id="passwordInput" type="password" placeholder="Password" />
                <button class="primary-btn" onclick="login()">Login</button>
            </div>
            <div id="errorMessage" class="error-message"></div>
        </div>

        <div id="licenseSection" class="hidden" style="padding: 24px;">
            <div class="license-box">
                <h2>🛡️ Activate License</h2>
                <div class="form-grid">
                    <input id="licenseKeyInput" type="text" placeholder="Enter your license key" />
                    <button class="primary-btn" onclick="activateLicense()">Activate</button>
                </div>
                <div id="licenseStatus" class="license-status inactive">❌ License Inactive</div>
            </div>
        </div>

        <div id="mainContent" class="content">
            <div class="api-key-info">
                <strong>⚙️ Setup:</strong> Add your free API key from <a href="https://www.alphavantage.co" target="_blank">AlphaVantage.co</a>
            </div>

            <div class="api-key-section">
                <input id="apiKeyInput" type="text" placeholder="Enter AlphaVantage API Key" />
                <button class="primary-btn" onclick="saveApiKey()">Save</button>
            </div>

            <div class="pair-selector">
                <button class="pair-btn active" onclick="selectPair('EUR/USD', 'EUR', 'USD')">EUR/USD</button>
                <button class="pair-btn" onclick="selectPair('GBP/USD', 'GBP', 'USD')">GBP/USD</button>
                <button class="pair-btn" onclick="selectPair('BTC/USD', 'BTC', 'USD')">BTC/USD</button>
                <button class="pair-btn" onclick="selectPair('XAU/USD', 'XAU', 'USD')">XAU/USD</button>
                <button class="pair-btn" onclick="selectPair('USD/JPY', 'USD', 'JPY')">USD/JPY</button>
                <button class="pair-btn" onclick="selectPair('USD/CHF', 'USD', 'CHF')">USD/CHF</button>
                <button class="pair-btn" onclick="selectPair('AUD/USD', 'AUD', 'USD')">AUD/USD</button>
                <button class="pair-btn" onclick="selectPair('USD/CAD', 'USD', 'CAD')">USD/CAD</button>
            </div>

            <div class="chart-grid">
                <div class="chart-panel">
                    <div class="chart-title">Price Chart</div>
                    <canvas id="priceChart"></canvas>
                </div>

                <div class="chart-panel">
                    <div class="chart-title">Stochastic Indicator</div>
                    <canvas id="stochasticChart"></canvas>
                </div>
            </div>

            <div class="signal-box">
                <div class="signal buy" id="buySignal">🟢 BUY<br><small id="buyReason">Awaiting data</small></div>
                <div class="signal sell" id="sellSignal">🔴 SELL<br><small id="sellReason">Awaiting data</small></div>
            </div>

            <button class="primary-btn" onclick="refreshData(event)">🔄 Refresh Data</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
